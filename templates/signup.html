{% extends "base.html" %}
{% block title %}Sign up - SaveX{% endblock %}
{% block content %}
<div class="card narrow">
    <h2>Create account</h2>
    {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
    <form method="post" action="/signup">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password">
        <label for="phone">Phone number for SMS expiry alerts (optional)</label>
        <input id="phone" name="phone" type="tel" placeholder="+919876543210" pattern="^\+[1-9][0-9\s\-()]{7,18}$">
        <button class="btn" type="submit">Sign up</button>
    </form>
    <p>Already registered? <a href="/login">Log in</a></p>
</div>
{% endblock %}
